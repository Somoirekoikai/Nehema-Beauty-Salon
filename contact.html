<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Nehema Beauty Salon</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-rose-50 text-gray-800">

<div id="header"></div>

<section class="bg-pink-100 text-center py-16 px-6">
    <h1 class="text-4xl font-bold mb-4">Contact Us</h1>
    <p class="text-gray-600">We would love to hear from you.</p>
</section>

<section class="max-w-6xl mx-auto py-16 px-6 grid md:grid-cols-2 gap-10">

    <div>
        <h2 class="text-3xl font-bold mb-6">Get in Touch</h2>

        <div class="space-y-5">
            <div>
                <h3 class="font-bold text-amber-800">Phone Number</h3>
                <p>+254 700 000 000</p>
            </div>

            <div>
                <h3 class="font-bold text-amber-800">Email Address</h3>
                <p>info@nehemabeauty.com</p>
            </div>

            <div>
                <h3 class="font-bold text-amber-800">Location</h3>
                <p>Your Salon Location, Kenya</p>
            </div>

            <div>
                <h3 class="font-bold text-amber-800">Opening Hours</h3>
                <p>Monday - Saturday: 8:00 AM - 7:00 PM</p>
                <p>Sunday: 10:00 AM - 4:00 PM</p>
            </div>
        </div>
    </div>

    <div class="bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-6">Send Us a Message</h2>


<form action="https://formspree.io/f/xnppzzgo"
      method="POST"
      class="space-y-5">


            <div>
                <label for="name" class="block font-medium mb-2">Full Name</label>
                <input type="text" id="name" name="name" required
                       class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label for="email" class="block font-medium mb-2">Email Address</label>
                <input type="email" id="email" name="email" required
                       class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label for="phone" class="block font-medium mb-2">Phone Number</label>
                <input type="tel" id="phone" name="phone"
                       class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label for="subject" class="block font-medium mb-2">Subject</label>
                <input type="text" id="subject" name="subject" required
                       class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label for="message" class="block font-medium mb-2">Message</label>
                <textarea id="message" name="message" rows="5" required
                          class="w-full border rounded-lg p-3"></textarea>
            </div>

            <button type="submit"
                    class="w-full bg-amber-700 hover:bg-amber-900 text-white py-3 rounded-lg">
                Send Message
            </button>

        </form>
    </div>

</section>

<div id="footer"></div>
<script src="js/components.js"></script>

</body>
</html>
