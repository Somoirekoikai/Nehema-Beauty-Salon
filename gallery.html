<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Nehema Beauty Salon</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>

<body class="bg-rose-50 text-gray-800">

    <!-- Header -->
    <div id="header"></div>

    <!-- Gallery Heading -->
    <section class="text-center py-16 px-6 bg-rose-100">
        <h1 class="text-4xl md:text-5xl font-bold text-rose-900 mb-4">
            Our Beauty Gallery
        </h1>

        <p class="text-gray-600 max-w-2xl mx-auto">
            Explore our beauty transformations, hairstyles, makeup,
            nail designs and salon experiences.
        </p>
    </section>

    <!-- Gallery Images -->
    <section class="max-w-7xl mx-auto px-6 py-16">

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

            <div class="rounded-xl overflow-hidden shadow-lg">
                <img src="images/g1.jpg"
                     alt="Professional hair styling"
                     class="w-full h-72 object-cover">
            </div>

            <div class="rounded-xl overflow-hidden shadow-lg">
                <img src="images/g2.jpg"
                     alt="Beauty salon hairstyle"
                     class="w-full h-72 object-cover">
            </div>

            <div class="rounded-xl overflow-hidden shadow-lg">
                <img src="images/g3.jpg"
                     alt="Beautiful nail design"
                     class="w-full h-72 object-cover">
            </div>

            <div class="rounded-xl overflow-hidden shadow-lg">
                <img src="images/g4.jpg"
                     alt="Professional makeup"
                     class="w-full h-72 object-cover">
            </div>

            <div class="rounded-xl overflow-hidden shadow-lg">
                <img src="images/g5.jpg"
                     alt="Beauty products"
                     class="w-full h-72 object-cover">
            </div>

            <div class="rounded-xl overflow-hidden shadow-lg">
                <img src="images/g6.jpg"
                     alt="Salon beauty experience"
                     class="w-full h-72 object-cover">
            </div>

        </div>
    </section>

    <!-- Call to Action -->
    <section class="bg-rose-900 text-white text-center py-14 px-6">
        <h2 class="text-3xl font-bold mb-4">
            Ready for Your Transformation?
        </h2>

        <p class="mb-6">
            Visit Nehema Beauty Salon and let us bring out your beauty.
        </p>

        <a href="booking.html"
           class="inline-block bg-white text-rose-900 px-8 py-3 rounded-full font-semibold hover:bg-rose-100">
            Book an Appointment
        </a>
    </section>

    <!-- Footer -->
    <div id="footer"></div>

    <script src="js/components.js"></script>

</body>
</html>
