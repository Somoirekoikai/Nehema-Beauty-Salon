<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment | Nehema Beauty Salon</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-rose-50 text-gray-800">

<div id="header"></div>

<section class="bg-pink-100 text-center py-16 px-6">
    <h1 class="text-4xl font-bold mb-4">Book an Appointment</h1>
    <p class="text-gray-600">Choose your preferred beauty service and appointment time.</p>
</section>

<section class="max-w-4xl mx-auto py-16 px-6">

    <div class="bg-white p-6 md:p-10 rounded-xl shadow-md">

        <h2 class="text-2xl font-bold mb-6">Appointment Request Form</h2>

        <form action="https://formspree.io/f/YOUR_BOOKING_FORM_ID"
              method="POST"
              class="space-y-5">

            <div>
                <label for="name" class="block font-medium mb-2">Full Name</label>
                <input type="text" id="name" name="name" required
                       class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label for="email" class="block font-medium mb-2">Email Address</label>
                <input type="email" id="email" name="email" required
                       class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label for="phone" class="block font-medium mb-2">Phone Number</label>
                <input type="tel" id="phone" name="phone" required
                       class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label for="service" class="block font-medium mb-2">Select Service</label>
                <select id="service" name="service" required
                        class="w-full border rounded-lg p-3 bg-white">
                    <option value="">Choose a service</option>
                    <option>Hair Styling</option>
                    <option>Hair Braiding</option>
                    <option>Manicure and Pedicure</option>
                    <option>Professional Makeup</option>
                    <option>Facial Treatments</option>
                    <option>Eyebrow Shaping</option>
                </select>
            </div>

            <div class="grid md:grid-cols-2 gap-5">
                <div>
                    <label for="date" class="block font-medium mb-2">Preferred Date</label>
                    <input type="date" id="date" name="date" required
                           class="w-full border rounded-lg p-3">
                </div>

                <div>
                    <label for="time" class="block font-medium mb-2">Preferred Time</label>
                    <select id="time" name="time" required
                            class="w-full border rounded-lg p-3 bg-white">
                        <option value="">Choose time</option>
                        <option>8:00 AM</option>
                        <option>9:00 AM</option>
                        <option>10:00 AM</option>
                        <option>11:00 AM</option>
                        <option>12:00 PM</option>
                        <option>1:00 PM</option>
                        <option>2:00 PM</option>
                        <option>3:00 PM</option>
                        <option>4:00 PM</option>
                        <option>5:00 PM</option>
                        <option>6:00 PM</option>
                    </select>
                </div>
            </div>

            <div>
                <label for="message" class="block font-medium mb-2">
                    Additional Requests
                </label>
                <textarea id="message" name="message" rows="4"
                          class="w-full border rounded-lg p-3"
                          placeholder="Any additional information..."></textarea>
            </div>

            <button type="submit"
                    class="w-full bg-amber-700 hover:bg-amber-900 text-white py-3 rounded-lg">
                Request Appointment
            </button>

        </form>
    </div>

</section>

<div id="footer"></div>
<script src="js/components.js"></script>

</body>
</html>
